  <body>
    <div id="root">
      <div id="vp-boot" role="status">
        <strong>Зареждане…</strong>
        <span>Ако екранът остане празен, натисни бутона по-долу.</span>
        <button type="button" id="vp-boot-reload">Обнови приложението</button>
      </div>
    </div>
    <script>
      (function () {
        var KEY = "vp-html-boot-reload-once";
        function hardRecover() {
          try {
            if (sessionStorage.getItem(KEY) === "1") {
              sessionStorage.removeItem(KEY);
              return;
            }
            sessionStorage.setItem(KEY, "1");
          } catch (e) {}
          var done = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set("_spa", String(Date.now()));
              u.searchParams.set("_recover", "html-boot");
              window.location.replace(u.toString());
            } catch (e2) {
              window.location.reload();
            }
          };
          var pending = [];
          try {
            if (window.caches && caches.keys) {
              pending.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e3) {}
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              pending.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
          } catch (e4) {}
          Promise.all(pending).then(done, done);
        }
        var btn = document.getElementById("vp-boot-reload");
        if (btn) btn.addEventListener("click", hardRecover);
        // If the main bundle never mounts React, force one recovery pass.
        window.setTimeout(function () {
          if (document.getElementById("vp-boot")) hardRecover();
        }, 20000);
      })();
    </script>
