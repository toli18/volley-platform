<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Клипове — Volley Platform</title>
<meta name="description" content="Вертикален feed с видео уроци — плъзни нагоре/надолу като TikTok." />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: Nunito, system-ui, sans-serif; }
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,.65) 0%, transparent 100%);
    pointer-events: none;
  }
  .top-bar a, .top-bar button { pointer-events: auto; color: #fff; font-weight: 800; font-size: .9rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .top-bar a { text-decoration: none; }
  .top-bar span { color: rgba(255,255,255,.85); font-weight: 700; font-size: .85rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .subs-btn {
    border: 2px solid rgba(255,255,255,.55); border-radius: 6px;
    background: rgba(0,0,0,.35); padding: 4px 10px; cursor: pointer;
    font-family: inherit; line-height: 1.2; min-width: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  .subs-btn.off { opacity: .45; border-color: rgba(255,255,255,.25); }
  .feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .slide {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    position: relative; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
    pointer-events: none;
  }
  .subs-overlay {
    position: absolute; left: 8px; right: 8px; top: max(52px, calc(env(safe-area-inset-top) + 44px));
    z-index: 12; text-align: center; pointer-events: none;
    color: #fff; font-size: clamp(.78rem, 3.2vw, .95rem); font-weight: 800; line-height: 1.35;
    text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.85);
    padding: 6px 10px; border-radius: 6px;
    background: rgba(0,0,0,.35);
    display: none;
  }
  .subs-overlay.on { display: block; }
  .controls {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(88px, calc(env(safe-area-inset-bottom) + 64px));
    z-index: 20; display: flex; gap: 10px; align-items: center;
    pointer-events: auto; touch-action: manipulation;
    opacity: 1; visibility: visible;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .controls.ui-hidden {
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  .ctrl-btn {
    border: 2px solid rgba(255,255,255,.75); border-radius: 999px;
    background: rgba(0,0,0,.55); color: #fff;
    font-family: inherit; font-weight: 800; font-size: .82rem;
    min-width: 48px; min-height: 48px; padding: 0 14px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  .ctrl-btn.ctrl-play { min-width: 56px; font-size: 1.1rem; }
  .ctrl-btn:active { background: rgba(255,255,255,.2); }
  @media (hover: hover) and (pointer: fine) {
    .controls { gap: 14px; bottom: max(96px, calc(env(safe-area-inset-bottom) + 72px)); }
    .ctrl-btn { min-width: 52px; min-height: 52px; font-size: .88rem; }
    .ctrl-btn.ctrl-play { min-width: 60px; font-size: 1.2rem; }
    .ctrl-btn:hover { background: rgba(255,255,255,.18); border-color: #fff; }
  }
  .sound-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 14; pointer-events: none;
    background: rgba(0,0,0,.55); color: #fff; font-weight: 800; font-size: .85rem;
    padding: 10px 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.45);
    display: none; text-align: center; max-width: 85%;
  }
  .sound-hint.on { display: block; pointer-events: auto; cursor: pointer; }
  .caption {
    position: absolute; left: 14px; right: 14px; bottom: max(24px, env(safe-area-inset-bottom));
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.9);
    pointer-events: none;
  }
  .caption b { display: block; font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .caption span { font-size: .82rem; opacity: .9; font-weight: 700; }
  .hint {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.5); font-size: .75rem; font-weight: 700;
    z-index: 10; pointer-events: none;
    animation: fade 4s ease forwards;
  }
  @keyframes fade { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="/uchebnik/">← Герои</a>
    <span>Клипове · плъзни ↕</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <button type="button" class="subs-btn" id="subsBtn" aria-pressed="true" title="Субтитри">CC</button>
      <a href="/uchebnik/infografiki/">Картинки</a>
    </div>
  </div>
  <p class="hint">−10 · ⏸ · +10 на всеки клип · на компютър: ← → и Space</p>
  <div class="feed" id="feed"></div>
  <script>
    const STEM = (src) => src.replace(/^.*\//, "").replace(/\.mp4$/, "");
    const CLIPS = [
      { src: "/uchebnik/posreshtane-stranichno.mp4", title: "Странично движение", sub: "Разделяща крачка при посрещане" },
      { src: "/uchebnik/posreshtane-konflikti.mp4", title: "Конфликти при посрещане", sub: "Ляв/десен конфликт · подготовка" },
      { src: "/uchebnik/posreshtane-lateralen-pas.mp4", title: "Страничен пас при флот", sub: "Пас настрани · з.6" },
      { src: "/uchebnik/posreshtane.mp4", title: "Посрещане", sub: "Линия · jump/float serve" },
      { src: "/uchebnik/rotacia-51.mp4", title: "Ротация 5-1", sub: "Шест позиции · либеро" },
      { src: "/uchebnik/edinichen-blok-i-zashtita.mp4", title: "Единичен блок", sub: "Защита зад единичен блок" },
      { src: "/uchebnik/dvoen-blok-i-zashtita.mp4", title: "Двоен блок", sub: "Затворена права" },
      { src: "/uchebnik/blok-funia.mp4", title: "Блок — насочване", sub: "Фуния · блок и защита" },
      { src: "/uchebnik/troen-blok.mp4", title: "Троен блок", sub: "Кога и как" },
      { src: "/uchebnik/ataka-z4-zamah.mp4", title: "Атака з.4 — замах", sub: "Диагонала и правата" },
      { src: "/uchebnik/diagonal-ataka.mp4", title: "Диагонал — посоки", sub: "Посоки на атака" },
      { src: "/uchebnik/centar-tempo.mp4", title: "Център — темпо", sub: "Темпо и комбинации" },
      { src: "/uchebnik/razpredelitel-centar.mp4", title: "Разпред. и център", sub: "Игра в играта · маршрути" },
      { src: "/uchebnik/z1-ataka.mp4", title: "Атака от з.1", sub: "Задна атака от дясно" },
      { src: "/uchebnik/pokritie-z4.mp4", title: "Покритие з.4", sub: "Покритие на атакуващ" },
      { src: "/uchebnik/dylga-diagonal.mp4", title: "Дълга диагонала", sub: "Защита на дълга диагонала" },
      { src: "/uchebnik/zashtita-z4.mp4", title: "Защита з.4", sub: "Защита срещу атака от з.4" },
      { src: "/uchebnik/tesna-diagonal.mp4", title: "Тесна диагонала", sub: "Защита на тесна диагонала" },
      { src: "/uchebnik/blok-greshka.mp4", title: "Грешка при блок", sub: "Скачаш твърде високо — защитата страда" },
      { src: "/uchebnik/moment-killer.mp4", title: "Спиране на момента", sub: "Най-големият momentum killer" },
      { src: "/uchebnik/sreden-elit.mp4", title: "Среден vs елит", sub: "Разликата при атака" },
      { src: "/uchebnik/lateralen-pas-vylo.mp4", title: "Страничен пас", sub: "Float сервис · пас настрани" },
      { src: "/uchebnik/tri-serva.mp4", title: "Три вида сервис", sub: "Jump · float · hybrid" },
      { src: "/uchebnik/tochki-troen-blok.mp4", title: "Точки срещу троен блок", sub: "Как да отбелязваш" },
      { src: "/uchebnik/vsiaki-ugli.mp4", title: "Всички ъгли", sub: "Как да удариш навсякъде" },
      { src: "/uchebnik/razp-ataka.mp4", title: "Разпределител атакува", sub: "Setters attacking" },
      { src: "/uchebnik/swing-blok.mp4", title: "Swing block", sub: "Грешка при swing block" },
      { src: "/uchebnik/timing-ataka.mp4", title: "Тайминг на атака", sub: "Най-лесният fix" },
      { src: "/uchebnik/centar-ugli.mp4", title: "Център — ъгли", sub: "Cut angles" },
      { src: "/uchebnik/paipe-variacii.mp4", title: "Pipe вариации", sub: "Задна атака з.6" },
      { src: "/uchebnik/loshi-greshki.mp4", title: "Лоши грешки", sub: "Какво да избягваш" },
      { src: "/uchebnik/tempo-stres.mp4", title: "Темпо срещу блок", sub: "Стрес за блокиращите" },
      { src: "/uchebnik/blok-slozhno.mp4", title: "Блокът е сложен", sub: "Повече от скачане" },
      { src: "/uchebnik/obraten-potok.mp4", title: "Обратен поток", sub: "Обратна посока на разпределителя" },
      { src: "/uchebnik/doverie-centar.mp4", title: "Доверие в центъра", sub: "Работа с центъра" },
    ].map((c) => ({ ...c, vtt: "/uchebnik/subs/" + STEM(c.src) + ".vtt" }));

    const feed = document.getElementById("feed");
    const subsBtn = document.getElementById("subsBtn");
    const videos = [];
    const cueCache = new Map();
    let subsOn = localStorage.getItem("uchebnik-subs") !== "off";
    const isIOS =
      /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let audioUnlocked =
      sessionStorage.getItem("uchebnik-audio") === "1" || !isIOS;
    let activeIndex = 0;
    const CONTROLS_HIDE_MS = 2800;
    let controlsHideTimer = null;

    function activeEntry() {
      return videos[activeIndex];
    }

    function setControlsVisible(entry, visible) {
      if (!entry?.controlsEl) return;
      entry.controlsEl.classList.toggle("ui-hidden", !visible);
    }

    function scheduleControlsHide(entry) {
      if (controlsHideTimer) clearTimeout(controlsHideTimer);
      if (!entry?.v || entry.v.paused || entry.userPaused) {
        setControlsVisible(entry, true);
        return;
      }
      controlsHideTimer = setTimeout(() => {
        if (activeIndex === entry.index && !entry.v.paused && !entry.userPaused) {
          setControlsVisible(entry, false);
        }
      }, CONTROLS_HIDE_MS);
    }

    function revealControls(entry) {
      if (!entry) return;
      setControlsVisible(entry, true);
      scheduleControlsHide(entry);
    }

    function revealActiveControls() {
      revealControls(activeEntry());
    }

    function togglePlay(entry) {
      if (!entry) return;
      unlockAudio();
      entry.v.muted = false;
      if (entry.v.paused) {
        entry.userPaused = false;
        playWithSound(entry.v);
      } else {
        entry.userPaused = true;
        entry.v.pause();
      }
      syncPlayBtn(entry);
      updateSoundHint(entry);
      revealControls(entry);
    }

    function seekActive(delta) {
      const entry = activeEntry();
      if (!entry) return;
      unlockAudio();
      entry.v.muted = false;
      seekVideo(entry.v, delta);
      if (entry.v.paused) {
        entry.userPaused = false;
        playWithSound(entry.v);
      }
      syncPlayBtn(entry);
      updateSoundHint(entry);
      revealControls(entry);
    }

    function unlockAudio() {
      audioUnlocked = true;
      sessionStorage.setItem("uchebnik-audio", "1");
      document.querySelectorAll(".sound-hint").forEach((h) => h.classList.remove("on"));
    }

    function syncPlayBtn(entry) {
      const btn = entry?.playBtn;
      if (!btn) return;
      btn.textContent = entry.v.paused ? "▶" : "⏸";
      btn.setAttribute("aria-label", entry.v.paused ? "Пусни" : "Пауза");
    }

    function updateSoundHint(entry) {
      if (!entry?.soundHint) return;
      const show = isIOS && entry.v.muted && !entry.v.paused && !audioUnlocked;
      entry.soundHint.classList.toggle("on", show);
      entry.soundHint.textContent = show ? "🔊 Докосни за звук" : "";
    }

    async function playWithSound(v) {
      if (audioUnlocked) v.muted = false;
      try {
        await v.play();
        if (audioUnlocked) v.muted = false;
        return true;
      } catch {
        if (!audioUnlocked) {
          v.muted = true;
          try {
            await v.play();
            return true;
          } catch {
            return false;
          }
        }
        return false;
      }
    }

    function seekVideo(v, delta) {
      if (!Number.isFinite(v.duration)) return;
      v.currentTime = Math.max(0, Math.min(v.duration - 0.05, v.currentTime + delta));
    }

    function parseVttTime(s) {
      const p = s.trim().split(":");
      const sec = parseFloat(p.pop().replace(",", "."));
      const min = +p.pop() || 0;
      const hr = +p.pop() || 0;
      return hr * 3600 + min * 60 + sec;
    }

    function parseVtt(text) {
      const cues = [];
      for (const block of text.trim().split(/\r?\n\r?\n+/)) {
        if (!block.trim() || block.startsWith("WEBVTT")) continue;
        const lines = block.split(/\r?\n/);
        const m = lines[0].match(/(.+?)\s*-->\s*(.+)/);
        if (!m) continue;
        cues.push({
          start: parseVttTime(m[1]),
          end: parseVttTime(m[2]),
          text: lines.slice(1).join(" "),
        });
      }
      return cues;
    }

    async function loadCues(url) {
      if (cueCache.has(url)) return cueCache.get(url);
      try {
        const res = await fetch(url);
        if (!res.ok) return [];
        const cues = parseVtt(await res.text());
        cueCache.set(url, cues);
        return cues;
      } catch {
        return [];
      }
    }

    function cueAt(cues, t) {
      for (const c of cues) {
        if (t >= c.start && t < c.end) return c.text;
      }
      return "";
    }

    function applySubsState() {
      subsBtn.classList.toggle("off", !subsOn);
      subsBtn.setAttribute("aria-pressed", subsOn ? "true" : "false");
      subsBtn.title = subsOn ? "Изключи субтитрите" : "Включи субтитрите";
      document.querySelectorAll(".subs-overlay").forEach((el) => {
        el.classList.toggle("on", subsOn);
        if (!subsOn) el.textContent = "";
      });
      localStorage.setItem("uchebnik-subs", subsOn ? "on" : "off");
    }

    subsBtn.addEventListener("click", () => {
      subsOn = !subsOn;
      applySubsState();
    });

    CLIPS.forEach((clip, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.index = i;
      const v = document.createElement("video");
      v.src = clip.src;
      v.playsInline = true;
      v.loop = true;
      v.preload = i < 2 ? "auto" : "metadata";
      v.setAttribute("playsinline", "");
      v.setAttribute("webkit-playsinline", "");
      v.setAttribute("x-webkit-airplay", "allow");
      const soundHint = document.createElement("button");
      soundHint.type = "button";
      soundHint.className = "sound-hint";
      soundHint.setAttribute("aria-label", "Включи звук");
      const controls = document.createElement("div");
      controls.className = "controls";
      controls.innerHTML =
        '<button type="button" class="ctrl-btn" data-seek="-10" aria-label="Назад 10 сек">−10</button>' +
        '<button type="button" class="ctrl-btn ctrl-play" aria-label="Пауза">⏸</button>' +
        '<button type="button" class="ctrl-btn" data-seek="10" aria-label="Напред 10 сек">+10</button>';
      const playBtn = controls.querySelector(".ctrl-play");
      const subs = document.createElement("div");
      subs.className = "subs-overlay" + (subsOn ? " on" : "");
      const cap = document.createElement("div");
      cap.className = "caption";
      cap.innerHTML = `<b>${clip.title}</b><span>${clip.sub}</span>`;
      slide.append(v, soundHint, controls, subs, cap);
      feed.appendChild(slide);
      const entry = {
        v, subs, vtt: clip.vtt, cues: null, playBtn, soundHint, controlsEl: controls, index: i, userPaused: false,
      };
      videos.push(entry);

      v.addEventListener("timeupdate", () => {
        if (!subsOn || !entry.cues?.length) return;
        const txt = cueAt(entry.cues, v.currentTime);
        if (subs.textContent !== txt) subs.textContent = txt;
      });
      v.addEventListener("play", () => { syncPlayBtn(entry); updateSoundHint(entry); scheduleControlsHide(entry); });
      v.addEventListener("pause", () => { syncPlayBtn(entry); updateSoundHint(entry); setControlsVisible(entry, true); });
      v.addEventListener("volumechange", () => updateSoundHint(entry));

      controls.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-seek], .ctrl-play");
        if (!btn) return;
        e.stopPropagation();
        if (btn.classList.contains("ctrl-play")) {
          togglePlay(entry);
          return;
        }
        unlockAudio();
        entry.v.muted = false;
        seekVideo(entry.v, parseInt(btn.dataset.seek, 10));
        if (entry.v.paused) {
          entry.userPaused = false;
          playWithSound(entry.v);
        }
        syncPlayBtn(entry);
        updateSoundHint(entry);
        revealControls(entry);
      });

      slide.addEventListener("click", (e) => {
        if (e.target.closest(".controls, .sound-hint")) return;
        if (activeIndex !== i) return;
        revealControls(entry);
      });

      soundHint.addEventListener("click", (e) => {
        e.stopPropagation();
        unlockAudio();
        v.muted = false;
        playWithSound(v);
        updateSoundHint(entry);
      });

      loadCues(clip.vtt).then((cues) => { entry.cues = cues; });
    });

    applySubsState();

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        const idx = +e.target.dataset.index;
        const entry = videos[idx];
        if (!entry) return;
        const { v, subs } = entry;
        if (e.isIntersecting && e.intersectionRatio >= 0.6) {
          activeIndex = idx;
          videos.forEach((x) => {
            if (x.index === idx) return;
            x.v.pause();
            x.v.currentTime = 0;
            x.subs.textContent = "";
            syncPlayBtn(x);
            updateSoundHint(x);
          });
          revealControls(entry);
          if (entry.userPaused) {
            syncPlayBtn(entry);
            updateSoundHint(entry);
          } else {
            playWithSound(v).then(() => {
              syncPlayBtn(entry);
              updateSoundHint(entry);
              scheduleControlsHide(entry);
            });
          }
        } else if (!v.paused) {
          v.pause();
          if (subs) subs.textContent = "";
          syncPlayBtn(entry);
          updateSoundHint(entry);
        }
      });
    }, { root: feed, threshold: [0.6] });

    feed.querySelectorAll(".slide").forEach((s) => io.observe(s));

    if (videos[0]) {
      playWithSound(videos[0].v).then(() => {
        syncPlayBtn(videos[0]);
        updateSoundHint(videos[0]);
        scheduleControlsHide(videos[0]);
      });
      revealControls(videos[0]);
    }

    feed.addEventListener("click", (e) => {
      if (e.target.closest(".subs-btn, .controls, .sound-hint, a, .top-bar")) return;
      const entry = activeEntry();
      revealControls(entry);
      togglePlay(entry);
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea, select")) return;
      const entry = activeEntry();
      if (!entry) return;
      revealControls(entry);
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay(entry);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        seekActive(-10);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        seekActive(10);
      }
    });

    feed.addEventListener("mousemove", () => revealActiveControls(), { passive: true });
    feed.addEventListener("touchstart", () => revealActiveControls(), { passive: true });

    if (isIOS) {
      document.body.addEventListener(
        "touchstart",
        () => {
          if (audioUnlocked) return;
          unlockAudio();
          const entry = activeEntry();
          if (entry && !entry.v.paused) {
            entry.v.muted = false;
            entry.v.play().catch(() => {});
            updateSoundHint(entry);
          }
        },
        { once: true, passive: true }
      );
    }
  </script>
</body>
</html>
