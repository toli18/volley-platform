<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Клипове — Volley Platform</title>
<meta name="description" content="Вертикален feed с видео уроци — плъзни нагоре/надолу като TikTok." />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: Nunito, system-ui, sans-serif; }
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,.65) 0%, transparent 100%);
    pointer-events: none;
  }
  .top-bar a, .top-bar button { pointer-events: auto; color: #fff; font-weight: 800; font-size: .9rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .top-bar a { text-decoration: none; }
  .top-bar span { color: rgba(255,255,255,.85); font-weight: 700; font-size: .85rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .subs-btn {
    border: 2px solid rgba(255,255,255,.55); border-radius: 6px;
    background: rgba(0,0,0,.35); padding: 4px 10px; cursor: pointer;
    font-family: inherit; line-height: 1.2; min-width: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  .subs-btn.off { opacity: .45; border-color: rgba(255,255,255,.25); }
  .feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .slide {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    position: relative; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
  }
  .subs-overlay {
    position: absolute; left: 8px; right: 8px; top: max(52px, calc(env(safe-area-inset-top) + 44px));
    z-index: 12; text-align: center; pointer-events: none;
    color: #fff; font-size: clamp(.78rem, 3.2vw, .95rem); font-weight: 800; line-height: 1.35;
    text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.85);
    padding: 6px 10px; border-radius: 6px;
    background: rgba(0,0,0,.35);
    display: none;
  }
  .subs-overlay.on { display: block; }
  .caption {
    position: absolute; left: 14px; right: 14px; bottom: max(24px, env(safe-area-inset-bottom));
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.9);
    pointer-events: none;
  }
  .caption b { display: block; font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .caption span { font-size: .82rem; opacity: .9; font-weight: 700; }
  .hint {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.5); font-size: .75rem; font-weight: 700;
    z-index: 10; pointer-events: none;
    animation: fade 4s ease forwards;
  }
  @keyframes fade { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="/uchebnik/">← Герои</a>
    <span>Клипове · плъзни ↕</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <button type="button" class="subs-btn" id="subsBtn" aria-pressed="true" title="Субтитри">CC</button>
      <a href="/uchebnik/infografiki/">Картинки</a>
    </div>
  </div>
  <p class="hint">CC = субтитри · плъзни нагоре за следващото</p>
  <div class="feed" id="feed"></div>
  <script>
    const STEM = (src) => src.replace(/^.*\//, "").replace(/\.mp4$/, "");
    const CLIPS = [
      { src: "/uchebnik/posreshtane-stranichno.mp4", title: "Странично движение", sub: "Разделяща крачка при посрещане" },
      { src: "/uchebnik/posreshtane-konflikti.mp4", title: "Конфликти при посрещане", sub: "Ляв/десен конфликт · подготовка" },
      { src: "/uchebnik/posreshtane-lateralen-pas.mp4", title: "Страничен пас при флот", sub: "Пас настрани · з.6" },
      { src: "/uchebnik/posreshtane.mp4", title: "Посрещане", sub: "Линия · jump/float serve" },
      { src: "/uchebnik/rotacia-51.mp4", title: "Ротация 5-1", sub: "Шест позиции · либеро" },
      { src: "/uchebnik/edinichen-blok-i-zashtita.mp4", title: "Единичен блок", sub: "Защита зад единичен блок" },
      { src: "/uchebnik/dvoen-blok-i-zashtita.mp4", title: "Двоен блок", sub: "Затворена права" },
      { src: "/uchebnik/blok-funia.mp4", title: "Блок — насочване", sub: "Фуния · блок и защита" },
      { src: "/uchebnik/troen-blok.mp4", title: "Троен блок", sub: "Кога и как" },
      { src: "/uchebnik/ataka-z4-zamah.mp4", title: "Атака з.4 — замах", sub: "Диагонала и правата" },
      { src: "/uchebnik/diagonal-ataka.mp4", title: "Диагонал — посоки", sub: "Посоки на атака" },
      { src: "/uchebnik/centar-tempo.mp4", title: "Център — темпо", sub: "Темпо и комбинации" },
      { src: "/uchebnik/razpredelitel-centar.mp4", title: "Разпред. и център", sub: "Игра в играта · маршрути" },
      { src: "/uchebnik/z1-ataka.mp4", title: "Атака от з.1", sub: "Задна атака от дясно" },
      { src: "/uchebnik/pokritie-z4.mp4", title: "Покритие з.4", sub: "Покритие на атакуващ" },
      { src: "/uchebnik/dylga-diagonal.mp4", title: "Дълга диагонала", sub: "Защита на дълга диагонала" },
      { src: "/uchebnik/zashtita-z4.mp4", title: "Защита з.4", sub: "Защита срещу атака от з.4" },
      { src: "/uchebnik/tesna-diagonal.mp4", title: "Тесна диагонала", sub: "Защита на тесна диагонала" },
      { src: "/uchebnik/blok-greshka.mp4", title: "Грешка при блок", sub: "Скачаш твърде високо — защитата страда" },
      { src: "/uchebnik/moment-killer.mp4", title: "Спиране на момента", sub: "Най-големият momentum killer" },
      { src: "/uchebnik/sreden-elit.mp4", title: "Среден vs елит", sub: "Разликата при атака" },
      { src: "/uchebnik/lateralen-pas-vylo.mp4", title: "Страничен пас", sub: "Float сервис · пас настрани" },
      { src: "/uchebnik/tri-serva.mp4", title: "Три вида сервис", sub: "Jump · float · hybrid" },
      { src: "/uchebnik/tochki-troen-blok.mp4", title: "Точки срещу троен блок", sub: "Как да отбелязваш" },
      { src: "/uchebnik/vsiaki-ugli.mp4", title: "Всички ъгли", sub: "Как да удариш навсякъде" },
      { src: "/uchebnik/razp-ataka.mp4", title: "Разпределител атакува", sub: "Setters attacking" },
      { src: "/uchebnik/swing-blok.mp4", title: "Swing block", sub: "Грешка при swing block" },
      { src: "/uchebnik/timing-ataka.mp4", title: "Тайминг на атака", sub: "Най-лесният fix" },
      { src: "/uchebnik/centar-ugli.mp4", title: "Център — ъгли", sub: "Cut angles" },
      { src: "/uchebnik/paipe-variacii.mp4", title: "Pipe вариации", sub: "Задна атака з.6" },
      { src: "/uchebnik/loshi-greshki.mp4", title: "Лоши грешки", sub: "Какво да избягваш" },
      { src: "/uchebnik/tempo-stres.mp4", title: "Темпо срещу блок", sub: "Стрес за блокиращите" },
      { src: "/uchebnik/blok-slozhno.mp4", title: "Блокът е сложен", sub: "Повече от скачане" },
      { src: "/uchebnik/obraten-potok.mp4", title: "Обратен поток", sub: "Обратна посока на разпределителя" },
      { src: "/uchebnik/doverie-centar.mp4", title: "Доверие в центъра", sub: "Работа с центъра" },
    ].map((c) => ({ ...c, vtt: "/uchebnik/subs/" + STEM(c.src) + ".vtt" }));

    const feed = document.getElementById("feed");
    const subsBtn = document.getElementById("subsBtn");
    const videos = [];
    const cueCache = new Map();
    let subsOn = localStorage.getItem("uchebnik-subs") !== "off";

    function parseVttTime(s) {
      const p = s.trim().split(":");
      const sec = parseFloat(p.pop().replace(",", "."));
      const min = +p.pop() || 0;
      const hr = +p.pop() || 0;
      return hr * 3600 + min * 60 + sec;
    }

    function parseVtt(text) {
      const cues = [];
      for (const block of text.trim().split(/\r?\n\r?\n+/)) {
        if (!block.trim() || block.startsWith("WEBVTT")) continue;
        const lines = block.split(/\r?\n/);
        const m = lines[0].match(/(.+?)\s*-->\s*(.+)/);
        if (!m) continue;
        cues.push({
          start: parseVttTime(m[1]),
          end: parseVttTime(m[2]),
          text: lines.slice(1).join(" "),
        });
      }
      return cues;
    }

    async function loadCues(url) {
      if (cueCache.has(url)) return cueCache.get(url);
      try {
        const res = await fetch(url);
        if (!res.ok) return [];
        const cues = parseVtt(await res.text());
        cueCache.set(url, cues);
        return cues;
      } catch {
        return [];
      }
    }

    function cueAt(cues, t) {
      for (const c of cues) {
        if (t >= c.start && t < c.end) return c.text;
      }
      return "";
    }

    function applySubsState() {
      subsBtn.classList.toggle("off", !subsOn);
      subsBtn.setAttribute("aria-pressed", subsOn ? "true" : "false");
      subsBtn.title = subsOn ? "Изключи субтитрите" : "Включи субтитрите";
      document.querySelectorAll(".subs-overlay").forEach((el) => {
        el.classList.toggle("on", subsOn);
        if (!subsOn) el.textContent = "";
      });
      localStorage.setItem("uchebnik-subs", subsOn ? "on" : "off");
    }

    subsBtn.addEventListener("click", () => {
      subsOn = !subsOn;
      applySubsState();
    });

    CLIPS.forEach((clip, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.index = i;
      const v = document.createElement("video");
      v.src = clip.src;
      v.playsInline = true;
      v.loop = true;
      v.preload = i < 2 ? "auto" : "metadata";
      v.setAttribute("playsinline", "");
      const subs = document.createElement("div");
      subs.className = "subs-overlay" + (subsOn ? " on" : "");
      const cap = document.createElement("div");
      cap.className = "caption";
      cap.innerHTML = `<b>${clip.title}</b><span>${clip.sub}</span>`;
      slide.append(v, subs, cap);
      feed.appendChild(slide);
      videos.push({ v, subs, vtt: clip.vtt, cues: null });

      v.addEventListener("timeupdate", () => {
        if (!subsOn || !videos[i].cues?.length) return;
        const txt = cueAt(videos[i].cues, v.currentTime);
        if (subs.textContent !== txt) subs.textContent = txt;
      });

      loadCues(clip.vtt).then((cues) => { videos[i].cues = cues; });
    });

    applySubsState();

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        const v = e.target.querySelector("video");
        const subs = e.target.querySelector(".subs-overlay");
        if (!v) return;
        if (e.isIntersecting && e.intersectionRatio >= 0.6) {
          videos.forEach((x) => { if (x.v !== v) { x.v.pause(); x.v.currentTime = 0; x.subs.textContent = ""; } });
          v.muted = false;
          v.play().catch(() => { v.muted = true; v.play(); });
        } else {
          v.pause();
          if (subs) subs.textContent = "";
        }
      });
    }, { root: feed, threshold: [0.6] });

    feed.querySelectorAll(".slide").forEach((s) => io.observe(s));

    videos[0]?.v.play().catch(() => { videos[0].v.muted = true; videos[0].v.play(); });

    feed.addEventListener("click", (e) => {
      if (e.target.closest(".subs-btn")) return;
      const active = videos.find((x) => !x.v.paused);
      if (active?.v.muted) { active.v.muted = false; active.v.play(); }
    });
  </script>
</body>
</html>
