<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Картинки — Волей Герои</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a1628; font-family: Nunito, system-ui, sans-serif; }
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,.7) 0%, transparent 100%);
    pointer-events: none;
  }
  .top-bar a { pointer-events: auto; color: #fff; text-decoration: none; font-weight: 800; font-size: .9rem; }
  .top-bar span { color: rgba(255,255,255,.85); font-weight: 700; font-size: .85rem; }
  .feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .feed.locked { overflow: hidden; touch-action: none; }
  .feed::-webkit-scrollbar { display: none; }
  .slide {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 52px 8px 72px; background: #0a1628;
  }
  .img-wrap {
    flex: 1; width: 100%; max-height: calc(100dvh - 120px);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-in; -webkit-tap-highlight-color: transparent;
  }
  .img-wrap img {
    max-width: 100%; max-height: calc(100dvh - 120px);
    width: auto; height: auto; object-fit: contain;
    border-radius: 8px; pointer-events: none; user-select: none;
    -webkit-user-drag: none;
  }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 12px 16px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, transparent 100%);
    color: #fff; pointer-events: none;
  }
  .caption b { display: block; font-size: 1rem; }
  .caption span { font-size: .78rem; opacity: .85; font-weight: 700; }
  .hint {
    position: fixed; bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px));
    left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.45); font-size: .72rem; font-weight: 700;
    pointer-events: none; animation: fade 5s ease forwards;
  }
  @keyframes fade { 0%,75% { opacity: 1; } 100% { opacity: 0; } }

  .zoom-layer {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.96);
    display: flex; flex-direction: column;
    touch-action: none;
  }
  .zoom-layer[hidden] { display: none; }
  .zoom-close {
    position: absolute; top: max(12px, env(safe-area-inset-top));
    right: 14px; z-index: 2;
    width: 44px; height: 44px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.15); color: #fff;
    font-size: 1.25rem; font-weight: 800; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .zoom-stage {
    flex: 1; width: 100%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .zoom-stage img {
    max-width: 100vw; max-height: 100%;
    width: auto; height: auto; object-fit: contain;
    transform-origin: center center;
    will-change: transform;
    user-select: none; pointer-events: none;
    -webkit-user-drag: none;
  }
  .zoom-hint {
    text-align: center; color: rgba(255,255,255,.55);
    font-size: .72rem; font-weight: 700;
    padding: 10px 16px max(14px, env(safe-area-inset-bottom));
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="/uchebnik/">← Герои</a>
    <span>Картинки · разшири · плъзни ↕</span>
    <a href="/uchebnik/klipove.html">Клипове</a>
  </div>
  <p class="hint">Докосни картинката · събери с два пръста · плъзни ↕</p>
  <div class="feed" id="feed"></div>
  <div class="caption" id="cap"><b></b><span></span></div>

  <div class="zoom-layer" id="zoomLayer" hidden>
    <button type="button" class="zoom-close" id="zoomClose" aria-label="Затвори">✕</button>
    <div class="zoom-stage" id="zoomStage">
      <img id="zoomImg" alt="" draggable="false" />
    </div>
    <p class="zoom-hint">Събери/разшири с два пръста · мести с един · ✕ или двойно докосване</p>
  </div>

  <script>
    const CARDS = [
      { src: "img/greshki-nachinaeshti.png", title: "9 грешки за начинаещи", cat: "Основи" },
      { src: "img/sedem-greshki.png", title: "7 чести грешки", cat: "Основи" },
      { src: "img/markirovka-igrishte.png", title: "Маркировка на игрището", cat: "Правила · зони" },
      { src: "img/rotacia-pravila.png", title: "Правила за ротация", cat: "5-1" },
      { src: "img/pas-5-klyucha.png", title: "5 ключа за пас с предмишница", cat: "Посрещане" },
      { src: "img/pas-pravilno-greshno.png", title: "Правилен vs грешен пас", cat: "Посрещане" },
      { src: "img/razpredelitel-saveti.png", title: "8 съвета за разпределителя", cat: "Разпределител" },
      { src: "img/nastroyka-prosti.png", title: "Позиция на пръстите при настройка", cat: "Разпределител · пас" },
      { src: "img/blok-stapki.png", title: "Как да станеш добър блокиращ", cat: "Блок" },
      { src: "img/blok-pravilno-greshno.png", title: "Блок — правилно vs грешно", cat: "Блок" },
      { src: "img/libero-umeniia.png", title: "Умения на либерото", cat: "Защита" },
      { src: "img/libero-zashtita-tricove.png", title: "Трикове в защита на либерото", cat: "Защита" },
      { src: "img/dolphin-dive.png", title: "Dolphin dive — стъпка по стъпка", cat: "Защита" },
      { src: "img/pliometrika-ataka.png", title: "Плиометрика за атакуващи", cat: "Атака · разбег" },
      { src: "img/jump-float-serve.png", title: "Jump float serve", cat: "Сервис · флот" },
      { src: "img/dieta-dneven-plan.png", title: "Дневен хранителен план", cat: "За родители" },
      { src: "img/ramo-profilaktika.png", title: "Профилактика на рамото", cat: "За родители" },
      { src: "img/zala-vs-plazh.png", title: "Зала vs плажен волейбол", cat: "Общо" },
    ];

    const feed = document.getElementById("feed");
    const cap = document.getElementById("cap");
    const capB = cap.querySelector("b");
    const capS = cap.querySelector("span");
    const zoomLayer = document.getElementById("zoomLayer");
    const zoomStage = document.getElementById("zoomStage");
    const zoomImg = document.getElementById("zoomImg");
    const zoomClose = document.getElementById("zoomClose");

    let zScale = 1, zTx = 0, zTy = 0;
    let zStartDist = 0, zStartScale = 1, zPanStart = null, zLastTap = 0;

    function dist(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function applyZoom() {
      zoomImg.style.transform = `translate3d(${zTx}px, ${zTy}px, 0) scale(${zScale})`;
    }

    function resetZoomTransform() {
      zScale = 1; zTx = 0; zTy = 0;
      applyZoom();
    }

    function openZoom(src, alt) {
      zoomImg.src = src;
      zoomImg.alt = alt;
      resetZoomTransform();
      zoomLayer.hidden = false;
      feed.classList.add("locked");
    }

    function closeZoom() {
      zoomLayer.hidden = true;
      feed.classList.remove("locked");
      resetZoomTransform();
      zPanStart = null;
    }

    function bindTapOpen(wrap, card) {
      let sx = 0, sy = 0, moved = false;
      let skipClick = false;

      wrap.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          openZoom(card.src, card.title);
          zStartDist = dist(e.touches[0], e.touches[1]);
          zStartScale = 1;
          return;
        }
        if (e.touches.length === 1) {
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          moved = false;
        }
      }, { passive: false });

      wrap.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && !zoomLayer.hidden) {
          onZoomTouchMove(e);
          return;
        }
        if (e.touches.length === 1 && !moved) {
          const dx = e.touches[0].clientX - sx;
          const dy = e.touches[0].clientY - sy;
          if (Math.hypot(dx, dy) > 12) moved = true;
        }
      }, { passive: false });

      wrap.addEventListener("touchend", () => {
        if (!moved && zoomLayer.hidden) {
          skipClick = true;
          openZoom(card.src, card.title);
        }
      });

      wrap.addEventListener("click", (e) => {
        if (skipClick) {
          skipClick = false;
          e.preventDefault();
          return;
        }
        openZoom(card.src, card.title);
      });
    }

    function onZoomTouchStart(e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        zStartDist = dist(e.touches[0], e.touches[1]);
        zStartScale = zScale;
      } else if (e.touches.length === 1 && zScale > 1.02) {
        zPanStart = { x: e.touches[0].clientX - zTx, y: e.touches[0].clientY - zTy };
      }
    }

    function onZoomTouchMove(e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        zScale = Math.min(5, Math.max(1, zStartScale * (dist(e.touches[0], e.touches[1]) / zStartDist)));
        applyZoom();
      } else if (e.touches.length === 1 && zScale > 1.02 && zPanStart) {
        e.preventDefault();
        zTx = e.touches[0].clientX - zPanStart.x;
        zTy = e.touches[0].clientY - zPanStart.y;
        applyZoom();
      }
    }

    function onZoomTouchEnd(e) {
      zPanStart = null;
      if (zScale < 1.02) resetZoomTransform();

      if (e.touches.length === 0 && e.changedTouches.length === 1) {
        const now = Date.now();
        if (now - zLastTap < 320) {
          if (zScale > 1.15) resetZoomTransform();
          else closeZoom();
        }
        zLastTap = now;
      }
    }

    zoomLayer.addEventListener("touchstart", onZoomTouchStart, { passive: false });
    zoomLayer.addEventListener("touchmove", onZoomTouchMove, { passive: false });
    zoomLayer.addEventListener("touchend", onZoomTouchEnd, { passive: false });
    zoomLayer.addEventListener("touchcancel", onZoomTouchEnd, { passive: false });
    document.addEventListener("touchmove", (e) => {
      if (!zoomLayer.hidden && e.touches.length === 2) onZoomTouchMove(e);
    }, { passive: false, capture: true });
    zoomClose.addEventListener("click", closeZoom);

    CARDS.forEach((c, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.i = i;
      const wrap = document.createElement("div");
      wrap.className = "img-wrap";
      wrap.setAttribute("role", "button");
      wrap.setAttribute("aria-label", "Увеличи: " + c.title);
      const img = document.createElement("img");
      img.src = c.src;
      img.alt = c.title;
      img.loading = i < 2 ? "eager" : "lazy";
      img.draggable = false;
      wrap.appendChild(img);
      slide.appendChild(wrap);
      feed.appendChild(slide);
      bindTapOpen(wrap, c);
    });

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && e.intersectionRatio >= 0.55) {
          const i = +e.target.dataset.i;
          capB.textContent = CARDS[i].title;
          capS.textContent = CARDS[i].cat + " · " + (i + 1) + " / " + CARDS.length;
        }
      });
    }, { root: feed, threshold: [0.55] });
    feed.querySelectorAll(".slide").forEach((s) => io.observe(s));
    capB.textContent = CARDS[0].title;
    capS.textContent = CARDS[0].cat + " · 1 / " + CARDS.length;
  </script>
</body>
</html>
