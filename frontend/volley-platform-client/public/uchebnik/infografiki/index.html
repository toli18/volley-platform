<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Картинки — Волей Герои</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a1628; font-family: Nunito, system-ui, sans-serif; }
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,.7) 0%, transparent 100%);
    pointer-events: none;
  }
  .top-bar a { pointer-events: auto; color: #fff; text-decoration: none; font-weight: 800; font-size: .9rem; }
  .top-bar span { color: rgba(255,255,255,.85); font-weight: 700; font-size: .85rem; }
  .feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .slide {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 52px 8px 72px; background: #0a1628;
  }
  .slide.zooming { scroll-snap-align: none; }
  .img-wrap {
    flex: 1; width: 100%; max-height: calc(100dvh - 120px);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: pan-y;
  }
  .img-wrap.zoomed { touch-action: none; }
  .img-wrap img {
    max-width: 100%; max-height: calc(100dvh - 120px);
    width: auto; height: auto; object-fit: contain;
    border-radius: 8px; transform-origin: center center;
    will-change: transform;
  }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 12px 16px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, transparent 100%);
    color: #fff; pointer-events: none;
  }
  .caption b { display: block; font-size: 1rem; }
  .caption span { font-size: .78rem; opacity: .85; font-weight: 700; }
  .hint {
    position: fixed; bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px));
    left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.45); font-size: .72rem; font-weight: 700;
    pointer-events: none; animation: fade 5s ease forwards;
  }
  @keyframes fade { 0%,75% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="/uchebnik/">← Герои</a>
    <span>Картинки · разшири · плъзни ↕</span>
    <a href="/uchebnik/klipove.html">Клипове</a>
  </div>
  <p class="hint">Събери/разшири с два пръста · двойно докосване · плъзни ↕</p>
  <div class="feed" id="feed"></div>
  <div class="caption" id="cap"><b></b><span></span></div>
  <script>
    const CARDS = [
      { src: "img/greshki-nachinaeshti.png", title: "9 грешки за начинаещи", cat: "Основи" },
      { src: "img/sedem-greshki.png", title: "7 чести грешки", cat: "Основи" },
      { src: "img/markirovka-igrishte.png", title: "Маркировка на игрището", cat: "Правила · зони" },
      { src: "img/rotacia-pravila.png", title: "Правила за ротация", cat: "5-1" },
      { src: "img/pas-5-klyucha.png", title: "5 ключа за пас с предмишница", cat: "Посрещане" },
      { src: "img/pas-pravilno-greshno.png", title: "Правилен vs грешен пас", cat: "Посрещане" },
      { src: "img/razpredelitel-saveti.png", title: "8 съвета за разпределителя", cat: "Разпределител" },
      { src: "img/nastroyka-prosti.png", title: "Позиция на пръстите при настройка", cat: "Разпределител · пас" },
      { src: "img/blok-stapki.png", title: "Как да станеш добър блокиращ", cat: "Блок" },
      { src: "img/blok-pravilno-greshno.png", title: "Блок — правилно vs грешно", cat: "Блок" },
      { src: "img/libero-umeniia.png", title: "Умения на либерото", cat: "Защита" },
      { src: "img/libero-zashtita-tricove.png", title: "Трикове в защита на либерото", cat: "Защита" },
      { src: "img/dolphin-dive.png", title: "Dolphin dive — стъпка по стъпка", cat: "Защита" },
      { src: "img/pliometrika-ataka.png", title: "Плиометрика за атакуващи", cat: "Атака · разбег" },
      { src: "img/jump-float-serve.png", title: "Jump float serve", cat: "Сервис · флот" },
      { src: "img/dieta-dneven-plan.png", title: "Дневен хранителен план", cat: "За родители" },
      { src: "img/ramo-profilaktika.png", title: "Профилактика на рамото", cat: "За родители" },
      { src: "img/zala-vs-plazh.png", title: "Зала vs плажен волейбол", cat: "Общо" },
    ];
    const feed = document.getElementById("feed");
    const cap = document.getElementById("cap");
    const capB = cap.querySelector("b");
    const capS = cap.querySelector("span");
    function initPinchZoom(slide, wrap, img) {
      let scale = 1, tx = 0, ty = 0;
      let startDist = 0, startScale = 1;
      let panStart = null, pinchMid = null;
      let lastTap = 0;

      function apply() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      }

      function dist(a, b) {
        return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }

      function setZoomed(on) {
        wrap.classList.toggle("zoomed", on);
        slide.classList.toggle("zooming", on);
        feed.style.overflowY = on ? "hidden" : "";
      }

      function reset() {
        scale = 1; tx = 0; ty = 0;
        apply();
        setZoomed(false);
      }

      function clampPan() {
        const r = wrap.getBoundingClientRect();
        const ir = img.getBoundingClientRect();
        const maxX = Math.max(0, (ir.width - r.width) / 2);
        const maxY = Math.max(0, (ir.height - r.height) / 2);
        tx = Math.min(maxX, Math.max(-maxX, tx));
        ty = Math.min(maxY, Math.max(-maxY, ty));
      }

      wrap.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          startDist = dist(e.touches[0], e.touches[1]);
          startScale = scale;
          pinchMid = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
          };
          setZoomed(true);
        } else if (e.touches.length === 1 && scale > 1.05) {
          panStart = { x: e.touches[0].clientX - tx, y: e.touches[0].clientY - ty };
          setZoomed(true);
        }
      }, { passive: false });

      wrap.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          scale = Math.min(4, Math.max(1, startScale * (dist(e.touches[0], e.touches[1]) / startDist)));
          apply();
          setZoomed(scale > 1.05);
        } else if (e.touches.length === 1 && scale > 1.05 && panStart) {
          e.preventDefault();
          tx = e.touches[0].clientX - panStart.x;
          ty = e.touches[0].clientY - panStart.y;
          clampPan();
          apply();
        }
      }, { passive: false });

      wrap.addEventListener("touchend", (e) => {
        panStart = null;
        if (scale <= 1.05) {
          reset();
          return;
        }
        clampPan();
        apply();
        const now = Date.now();
        if (e.changedTouches.length === 1 && now - lastTap < 320) {
          reset();
        }
        lastTap = now;
      });

      wrap.addEventListener("dblclick", () => reset());
      wrap._resetZoom = reset;
    }

    CARDS.forEach((c, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.i = i;
      const wrap = document.createElement("div");
      wrap.className = "img-wrap";
      const img = document.createElement("img");
      img.src = c.src;
      img.alt = c.title;
      img.loading = i < 2 ? "eager" : "lazy";
      img.draggable = false;
      wrap.appendChild(img);
      slide.appendChild(wrap);
      feed.appendChild(slide);
      initPinchZoom(slide, wrap, img);
    });
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && e.intersectionRatio >= 0.55) {
          const i = +e.target.dataset.i;
          capB.textContent = CARDS[i].title;
          capS.textContent = CARDS[i].cat + " · " + (i + 1) + " / " + CARDS.length;
          feed.querySelectorAll(".slide").forEach((s) => {
            if (s !== e.target) s.querySelector(".img-wrap")?._resetZoom?.();
          });
          feed.style.overflowY = "";
        }
      });
    }, { root: feed, threshold: [0.55] });
    feed.querySelectorAll(".slide").forEach((s) => io.observe(s));
    capB.textContent = CARDS[0].title;
    capS.textContent = CARDS[0].cat + " · 1 / " + CARDS.length;
  </script>
</body>
</html>
