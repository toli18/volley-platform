<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Двоен блок и защита — Volley Platform</title>
<meta name="description" content="Как се разпределя защитата зад двоен блок със затворена права — за набор 2013–2015." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --deep: #0a3d4a;
    --teal: #0d8a8a;
    --sand: #fff6e8;
    --pop: #e85d04;
    --ink: #1a2a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    background: linear-gradient(180deg, #e8f7f5 0%, var(--sand) 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px 16px 32px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .back {
    display: inline-block;
    margin-bottom: 12px;
    color: var(--teal);
    font-weight: 800;
    text-decoration: none;
    font-size: .95rem;
  }
  h1 {
    font-size: clamp(1.45rem, 5vw, 1.85rem);
    font-weight: 800;
    color: var(--deep);
    line-height: 1.15;
  }
  .sub {
    margin-top: 8px;
    font-size: .95rem;
    font-weight: 600;
    color: #355;
  }
  .video-box {
    margin-top: 18px;
    border-radius: 16px;
    overflow: hidden;
    border: 3px solid var(--deep);
    background: #000;
    box-shadow: 0 8px 24px rgba(10, 61, 74, .18);
  }
  video {
    display: block;
    width: 100%;
    max-height: 78vh;
    background: #000;
  }
  .tip {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #fff;
    border: 2px solid rgba(13, 138, 138, .25);
    font-size: .9rem;
    line-height: 1.45;
  }
  .tip b { color: var(--pop); }
  .links {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .links a {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 999px;
    background: #fff;
    border: 2px solid var(--deep);
    color: var(--deep);
    font-weight: 800;
    font-size: .85rem;
    text-decoration: none;
  }
  .links a.main { background: var(--pop); color: #fff; border-color: var(--deep); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/uchebnik/">← Волей Герои</a>
    <h1>Двоен блок и защита</h1>
    <p class="sub">Затворена права · разпределение в з.4, з.5, з.6 и з.1</p>

    <div class="video-box">
      <video controls playsinline preload="metadata" poster="">
        <source src="/uchebnik/dvoen-blok-i-zashtita.mp4" type="video/mp4" />
        Браузърът не поддържа видео. <a href="/uchebnik/dvoen-blok-i-zashtita.mp4">Свали файла</a>.
      </video>
    </div>

    <p class="tip">
      <b>Съвет:</b> На телефон натисни ▶️. Ако няма звук — провери дали не е на mute.
      Виж и комикса „Волей Герои“ за ротация и движение без топка.
    </p>

    <div class="links">
      <a class="main" href="/uchebnik/">Волей Герои</a>
      <a href="/uchebnik/dvoen-blok-i-zashtita.mp4" download>Свали видеото</a>
    </div>
  </div>
</body>
</html>
