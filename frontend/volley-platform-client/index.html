<!doctype html>
<html lang="bg" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#0b3d91" />
    <title>Volley Coach Platform</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8fafc; }
      #vp-boot {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      #vp-boot strong { font-size: 18px; }
      #vp-boot span { font-size: 14px; color: #475569; max-width: 28rem; line-height: 1.45; }
      #vp-boot button {
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: #0b3d91;
        color: #fff;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
      }
      #vp-boot[data-stuck="1"] { background: #fff7ed; }
      #vp-boot[data-stuck="1"] strong { color: #9a3412; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="vp-boot" role="status">
        <strong id="vp-boot-title">Зареждане…</strong>
        <span id="vp-boot-msg">Ако екранът остане празен, натисни бутона по-долу. Отвори линка в Safari или Chrome (не от Messenger).</span>
        <button type="button" id="vp-boot-reload">Обнови приложението</button>
      </div>
    </div>
    <script>
      (function () {
        var KEY = "vp-html-boot-reload-once";
        var boot = document.getElementById("vp-boot");
        var title = document.getElementById("vp-boot-title");
        var msg = document.getElementById("vp-boot-msg");

        // Canonical host: SPA+API together. Vercel is only a mirror.
        var RAILWAY = "https://volley-platform-production.up.railway.app";
        var FAILOVER_KEY = "vp-origin-failover-once";

        function onVercelMirror() {
          try {
            return String(window.location.hostname || "").toLowerCase().indexOf("vercel.app") !== -1;
          } catch (e) {
            return false;
          }
        }

        function railwayMirrorHref() {
          try {
            var u = new URL(window.location.href);
            return RAILWAY + u.pathname + u.search + u.hash;
          } catch (e) {
            return RAILWAY + "/";
          }
        }

        function tryOriginFailover(reason) {
          if (!onVercelMirror()) return false;
          try {
            if (sessionStorage.getItem(FAILOVER_KEY) === "1") return false;
            sessionStorage.setItem(FAILOVER_KEY, "1");
          } catch (e) {}
          try {
            var dest = new URL(railwayMirrorHref());
            dest.searchParams.set("_failover", String(reason || "boot").slice(0, 40));
            window.location.replace(dest.toString());
            return true;
          } catch (e2) {
            window.location.replace(RAILWAY);
            return true;
          }
        }

        function markStuck(reason) {
          if (!boot) return;
          boot.setAttribute("data-stuck", "1");
          if (title) title.textContent = "Не можа да се зареди";
          if (msg) {
            msg.textContent = onVercelMirror()
              ? "Натисни „Обнови“ или отвори резервния сървър (Railway). Не отваряй от Messenger."
              : "Натисни „Обнови“. Ако пак не тръгне: Safari → Aa → „Искане за десктоп сайт“ изкл. / изчисти данни за сайта. Не отваряй от Messenger.";
          }
          try {
            boot.setAttribute("data-reason", String(reason || "").slice(0, 60));
          } catch (e) {}
          try {
            if (onVercelMirror() && !document.getElementById("vp-boot-mirror")) {
              var mirrorBtn = document.createElement("button");
              mirrorBtn.type = "button";
              mirrorBtn.id = "vp-boot-mirror";
              mirrorBtn.textContent = "Отвори резервен сървър";
              mirrorBtn.addEventListener("click", function () {
                window.location.replace(railwayMirrorHref());
              });
              boot.appendChild(mirrorBtn);
            }
          } catch (e3) {}
        }

        function hardRecover(reason) {
          try {
            if (sessionStorage.getItem(KEY) === "1") {
              sessionStorage.removeItem(KEY);
              if (tryOriginFailover(reason || "already-recovered")) return;
              markStuck(reason || "already-recovered");
              return;
            }
            sessionStorage.setItem(KEY, "1");
          } catch (e) {
            markStuck("storage");
          }
          var done = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set("_spa", String(Date.now()));
              u.searchParams.set("_recover", String(reason || "html-boot").slice(0, 40));
              window.location.replace(u.toString());
            } catch (e2) {
              window.location.reload();
            }
          };
          var pending = [];
          try {
            if (window.caches && caches.keys) {
              pending.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e3) {}
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              pending.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
          } catch (e4) {}
          Promise.all(pending).then(done, done);
        }

        var btn = document.getElementById("vp-boot-reload");
        if (btn) btn.addEventListener("click", function () { hardRecover("manual"); });
        // Clear one-shot failover flag after a successful navigation window.
        try {
          if (!onVercelMirror()) sessionStorage.removeItem(FAILOVER_KEY);
        } catch (e5) {}

        // Module script / asset load failures (classic listener — works even if modules fail).
        window.addEventListener(
          "error",
          function (event) {
            var t = event && event.target;
            var tag = t && t.tagName ? String(t.tagName).toLowerCase() : "";
            if (tag === "script" || tag === "link") {
              hardRecover("asset-error");
            }
          },
          true
        );

        window.addEventListener("unhandledrejection", function (event) {
          var message = String((event && event.reason && event.reason.message) || (event && event.reason) || "");
          if (
            message.indexOf("Failed to fetch dynamically imported module") !== -1 ||
            message.indexOf("Importing a module script failed") !== -1 ||
            message.indexOf("error loading dynamically imported module") !== -1
          ) {
            hardRecover("dynamic-import");
          }
        });

        // If React never mounts, recover once; then show stuck UI (never silent white).
        window.setTimeout(function () {
          if (document.getElementById("vp-boot")) hardRecover("timeout");
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
