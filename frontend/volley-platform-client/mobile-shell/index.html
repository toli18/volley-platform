<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Volley Coach BUL</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8fafc; font-family: system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-content: center; gap: 10px; padding: 24px; text-align: center; color: #0f172a; }
      a { color: #0b3d91; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <strong>Volley Coach BUL</strong>
      <span>Зареждане на портала…</span>
      <a href="https://volley-platform-production.up.railway.app/app">Отвори портала</a>
      <a href="https://volley-platform-bul.vercel.app/app">Резервен вход</a>
    </main>
    <script>
      // Canonical: Railway (SPA+API). Vercel only if Railway fails to navigate.
      var PRIMARY = "https://volley-platform-production.up.railway.app/app";
      var MIRROR = "https://volley-platform-bul.vercel.app/app";
      window.location.replace(PRIMARY);
      setTimeout(function () {
        // If still on this shell after 8s, offer mirror (page never left).
        if (!document.hidden) {
          var a = document.querySelector('a[href="' + MIRROR + '"]');
          if (a) a.style.fontSize = "18px";
        }
      }, 8000);
    </script>
  </body>
</html>
