<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Троян Волей</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8fafc; font-family: system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-content: center; gap: 10px; padding: 24px; text-align: center; color: #0f172a; }
      a { color: #16a34a; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <strong>Троян Волей</strong>
      <span>Зареждане на портала…</span>
      <a href="https://volley-platform.vercel.app/app">Отвори в браузър</a>
    </main>
    <script>
      // Offline / misconfigured fallback — Capacitor normally loads server.url.
      if (!window.Capacitor) {
        window.location.replace("https://volley-platform.vercel.app/app");
      }
    </script>
  </body>
</html>
